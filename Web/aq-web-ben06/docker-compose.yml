services:
  db:
    image: mysql:5.7
    container_name: aq-web-ben06-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ica_lab
      MYSQL_USER: billu
      MYSQL_PASSWORD: b0x_billu
    volumes:
      - ./database/ica_lab.sql:/docker-entrypoint-initdb.d/ica_lab.sql:ro
    restart: unless-stopped

  web:
    image: php:8.0-apache
    container_name: aq-web-ben06
    ports:
      - "5106:80"
    volumes:
      - ./:/var/www/html
    depends_on:
      - db
    command: >
      bash -c "docker-php-ext-install mysqli
      && sed -i 's/127.0.0.1/db/' /var/www/html/c0nnection.php
      && apache2-foreground"
    restart: unless-stopped
