version: '3.2'

services:
  web:
    build: ./web
    restart: always
    ports:
      - "5138:443"
      - "20380:80"
    environment:
      - "BOT_HOST=bot"
      - "SAFE_ORIGINS=https://web,http://letters.asisctf.com,https://letters.asisctf.com"
  bot:
    build: ./bot
    restart: always
    ports:
      - "20381:8000"
    environment:
      - "FLAG=ASIS{test-flag}"
      - "CAPTCHA_SECRET="
