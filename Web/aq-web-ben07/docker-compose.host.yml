services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: docmanager
      POSTGRES_USER: docmanager
      POSTGRES_PASSWORD: docmanager

  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: ./docmanager
    command: >
      sh -c "
      echo 'Waiting for database...' &&
      until pg_isready -h db -U docmanager; do sleep 2; done &&
      python manage.py migrate --run-syncdb &&
      gunicorn docmanager.wsgi:application --bind 0.0.0.0:8000 --workers 3
      "
    environment:
      DJANGO_SECRET_KEY: lab-django-secret-key
      DB_NAME: docmanager
      DB_USER: docmanager
      DB_PASSWORD: docmanager
      DB_HOST: db
      DB_PORT: 5432
      MINIO_ENDPOINT: "minio:9000"
      MINIO_SECURE: "False"
      MINIO_BUCKET: documents
      JWT_SECRET_KEY: lab-jwt-secret-key
    ports:
      - "5107:8000"
    depends_on:
      - db
      - minio
