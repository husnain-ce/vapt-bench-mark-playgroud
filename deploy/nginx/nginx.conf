# Base nginx config for the bench reverse proxy. Per-target server blocks are
# generated by `bench proxy up` into conf.d/ (mounted from .bench/nginx/conf.d).
worker_processes auto;
events { worker_connections 1024; }
http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    server_tokens off;

    # Fallback: unknown host -> simple index.
    server {
        listen 80 default_server;
        server_name _;
        location / {
            add_header Content-Type text/plain;
            return 200 "bench proxy up. Reach a target at <id>.<base-domain>\n";
        }
    }

    include /etc/nginx/conf.d/*.conf;
}
